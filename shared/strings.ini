# Тексты интерфейса для обеих версий (Linux и Windows) и страницы на телефоне.
# Формат: [язык], затем ключ = значение. {n}, {a}, {b} подставляет программа.
# В значениях нельзя использовать символы " \ < > & (они попадают в HTML и JavaScript).

[ru]
app.title = QR-мост
